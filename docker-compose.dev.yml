# Development override: hot-reload web (next dev) + source mounts.
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#
# Note: `environment` lists replace (not merge with) the base file, so all
# variables are repeated here.
services:
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-effective_memory}
    command: ["npm", "run", "db:migrate"]

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: ["npm", "run", "dev"]
    # Run as the host user so files written into the bind mount (.next/,
    # public/) stay owned by you, not root. Override with UID/GID if yours
    # isn't 1000 (the image's `node` user).
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-effective_memory}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      - OWNER_GENERATION_DAILY_LIMIT=${OWNER_GENERATION_DAILY_LIMIT:-25}
    volumes:
      - .:/app
      - /app/node_modules

  worker:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: ["npm", "run", "worker"]
    # Run as the host user so files written into the bind mount (.next/,
    # public/) stay owned by you, not root. Override with UID/GID if yours
    # isn't 1000 (the image's `node` user).
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-effective_memory}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - REDIS_URL=redis://redis:6379
      - OWNER_GENERATION_DAILY_LIMIT=${OWNER_GENERATION_DAILY_LIMIT:-25}
      - DRAFT_PIPELINE_INTERVAL_MS=${DRAFT_PIPELINE_INTERVAL_MS:-60000}
    volumes:
      - .:/app
      - /app/node_modules
